name: Build the app

# A new version is published for every "v…" tag (e.g. v1.0.0), or by hand from the
# Actions tab > "Build the app" > "Run workflow", entering the version number.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version number to publish (e.g. v1.4.0); leave empty to build without publishing"
        required: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
          - os: macos-latest   # Apple Silicon Macs (M1, M2…)
            platform: Mac-AppleSilicon
          - os: macos-15-intel # Intel Macs
            platform: Mac-Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller>=6.10"
      - name: Package
        shell: bash
        run: |
          echo 'VERSION = "${{ inputs.version || github.ref_name }}"' > _version.py
          SEP=":"; [ "$RUNNER_OS" = "Windows" ] && SEP=";"
          pyinstaller --onefile --name Playlist-Extractor \
            --add-data "index.html${SEP}." --collect-submodules yt_dlp --collect-all miniaudio app.py
      # Two zips per platform: the English-named one to download, and a copy under the old French
      # name so that apps installed before v1.3.0 (which look for that name) can still auto-update.
      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd dist
          7z a ../Playlist-Extractor-${{ matrix.platform }}.zip Playlist-Extractor.exe
          cp Playlist-Extractor.exe Extracteur-Playlist.exe
          7z a ../Extracteur-Playlist-${{ matrix.platform }}.zip Extracteur-Playlist.exe
      - name: Zip (Mac)
        if: runner.os == 'macOS'
        run: |
          cd dist
          ditto -c -k --keepParent Playlist-Extractor ../Playlist-Extractor-${{ matrix.platform }}.zip
          cp Playlist-Extractor Extracteur-Playlist
          ditto -c -k --keepParent Extracteur-Playlist ../Extracteur-Playlist-${{ matrix.platform }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: "*.zip"

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || inputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          name: Playlist Extractor ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: assets/*
          body: |
            ## Download
            - **Windows**: `Playlist-Extractor-Windows.zip`
            - **Mac M1/M2/M3/M4**: `Playlist-Extractor-Mac-AppleSilicon.zip`
            - **Intel Mac**: `Playlist-Extractor-Mac-Intel.zip`

            Unzip it, then double-click `Playlist-Extractor`. The app opens in your web browser; keep the black window open while you use it.
            The app updates itself automatically at launch whenever a new version is published.

            **First launch**: the app isn't signed, so
            - Windows shows "Windows protected your PC": click *More info*, then *Run anyway*.
            - macOS refuses to open it: go to *System Settings > Privacy & Security*, scroll down, click *Open Anyway*, then launch it again.

            _The `Extracteur-Playlist-*.zip` files are only used by older versions to update themselves; you can ignore them._
