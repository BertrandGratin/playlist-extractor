<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playlist Extractor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rokkitt:wght@400;600;700;800&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Look inspired by zigzag.fm: black, square corners, slab-serif labels, purple tiles, orange highlights. */
  :root {
    --bg: #000; --panel: #0e0e0e; --panel-2: #161616; --panel-3: #1d1d1d; --border: #232323; --border-2: #303030;
    --text: #e8e8e8; --muted: #8b8b8b; --dim: #5d5d5d;
    --purple: #5e1a73; --purple-2: #7b2a93; --magenta: #c45ad9; --orange: #ff7a1a; --green: #1f9d63;
    --serif: "Rokkitt", "Rockwell", Georgia, serif; --sans: "Roboto", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); }
  body { margin: 0; min-height: 100vh; font-family: var(--sans); font-size: 14px; color: var(--text); }
  a { color: inherit; }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 0; color: inherit; background: none; }
  .serif { font-family: var(--serif); }
  .muted { color: var(--muted); }

  /* Faint purple tile grid in the background, like zigzag's exploration map. */
  body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background-image: linear-gradient(#000 2px, transparent 2px), linear-gradient(90deg, #000 2px, transparent 2px);
    background-size: 34px 34px; background-color: #170a20; opacity: .9;
    mask-image: radial-gradient(ellipse at center, rgba(0,0,0,.9), rgba(0,0,0,.25) 70%); }
  body:not(.landing)::before { opacity: .35; }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px 60px; }

  /* Top bar (after the first extraction) / centred hero (landing) */
  .hero { display: flex; align-items: center; gap: 18px; padding: 14px 0; border-bottom: 1px solid var(--border);
          margin-bottom: 18px; }
  header { display: flex; align-items: center; gap: 10px; flex: none; }
  .logo { width: 30px; height: 30px; display: grid; place-items: center; background: var(--purple); }
  .logo svg { width: 18px; height: 18px; }
  h1 { font-family: var(--serif); font-weight: 800; font-size: 22px; margin: 0; letter-spacing: .01em; }
  .sub { display: none; color: var(--muted); margin: 0; font-family: var(--serif); font-size: 16px; }
  form { flex: 1; display: flex; max-width: 720px; border: 1px solid var(--border-2); background: var(--panel); }
  input { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: var(--text);
          font: inherit; font-size: 14px; padding: 10px 14px; }
  input::placeholder { color: var(--dim); }
  form:focus-within { border-color: var(--purple-2); }
  .primary { font-family: var(--serif); font-weight: 700; font-size: 16px; padding: 0 22px; background: var(--panel-3);
             border-left: 1px solid var(--border-2); white-space: nowrap; transition: background .15s; }
  .primary:hover { background: var(--purple); }
  .primary:disabled { cursor: wait; }

  body.landing .wrap { padding-bottom: 0; }
  body.landing .hero { min-height: calc(100vh - 50px); flex-direction: column; justify-content: center; gap: 26px;
                       border: 0; margin: 0; text-align: center; }
  body.landing header { flex-direction: column; gap: 14px; }
  body.landing .logo { width: 64px; height: 64px; }
  body.landing .logo svg { width: 34px; height: 34px; }
  body.landing h1 { font-size: 58px; line-height: 1; }
  body.landing .sub { display: block; }
  body.landing form { width: 100%; max-width: 640px; flex: none; border-color: #3a3a3a; }
  body.landing input { font-size: 15px; padding: 15px 18px; }
  body.landing .primary { font-size: 18px; padding: 0 28px; }

  .error { padding: 10px 14px; background: #1a0707; border: 1px solid #5a1a1a; color: #ff9b9b; display: none;
           width: 100%; max-width: 640px; text-align: left; }
  body:not(.landing) .error { margin: -8px 0 16px; max-width: none; }

  /* Panels */
  .results { display: none; }
  .panel { background: var(--panel); border: 1px solid var(--border); }
  .ghost { background: var(--panel-2); border: 1px solid var(--border-2); padding: 7px 14px; font-family: var(--serif);
           font-weight: 600; font-size: 15px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
  .ghost:hover { background: var(--panel-3); border-color: #444; }
  .ghost.sm { padding: 3px 9px; font-size: 13px; }

  /* Playlist header */
  .pl { display: grid; grid-template-columns: auto 1fr; gap: 20px; padding: 14px; }
  .pl-imgs { display: flex; flex-direction: column; gap: 6px; }
  .pl-main { width: 240px; aspect-ratio: 16 / 9; object-fit: cover; background: var(--panel-2); display: block; }
  .pl-thumbs { display: flex; gap: 4px; align-items: center; }
  .pl-thumbs img { width: 48px; aspect-ratio: 16 / 9; object-fit: cover; cursor: pointer; opacity: .55; outline: 1px solid transparent; }
  .pl-thumbs img:hover, .pl-thumbs img.on { opacity: 1; outline-color: var(--magenta); }
  .pl-title { font-family: var(--serif); font-weight: 800; font-size: 38px; line-height: 1.05; margin: 0; }
  .count { font-family: var(--serif); font-size: 15px; color: #cfcfcf; margin-top: 6px; }
  .count .owner { color: var(--orange); }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 16px; }
  .progress { height: 2px; background: var(--panel-3); margin-top: 16px; overflow: hidden; }
  .progress div { height: 100%; width: 0; background: var(--magenta); transition: width .3s; }
  .progress-label { font-size: 12px; color: var(--muted); margin-top: 6px; font-family: var(--serif); }

  /* Sections */
  details.sec { margin-top: 14px; }
  details.sec > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 9px 14px;
                          background: var(--panel); border: 1px solid var(--border); user-select: none;
                          font-family: var(--serif); font-weight: 700; font-size: 18px; }
  details.sec > summary::-webkit-details-marker { display: none; }
  details.sec > summary::after { content: "›"; margin-left: auto; color: var(--muted); font-size: 20px; transition: .15s; }
  details.sec[open] > summary::after { transform: rotate(90deg); }
  details.sec[open] > summary { border-bottom-color: transparent; }
  .sec-body { border: 1px solid var(--border); border-top: 0; background: var(--panel); padding: 12px; }
  .badge { font-family: var(--serif); font-size: 13px; font-weight: 600; color: var(--text); background: var(--panel-3);
           padding: 0 7px; line-height: 20px; }
  .empty { color: var(--muted); font-family: var(--serif); font-size: 15px; padding: 18px 4px; }

  /* Artists */
  .artists-list { display: flex; flex-direction: column; gap: 10px; }
  .acard { display: grid; grid-template-columns: 150px 1fr; gap: 18px; padding: 12px; background: #090909;
           border: 1px solid var(--border); scroll-margin-top: 20px; }
  .acard.flash, .alb.flash { outline: 2px solid var(--magenta); }
  .a-main { width: 150px; height: 150px; object-fit: cover; background: var(--purple); display: block; }
  .a-name { font-family: var(--serif); font-weight: 800; font-size: 34px; line-height: 1; margin: 0; }
  .a-meta { font-family: var(--serif); font-size: 15px; color: #cfcfcf; margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; }
  .chip { font-size: 13px; padding: 3px 10px; border: 1px solid var(--border-2); background: var(--panel-2); color: #d6d6d6; }
  .desc-box { margin-top: 10px; background: var(--panel-2); border: 1px solid var(--border); padding: 10px 12px; }
  .desc-h { font-family: var(--serif); font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .desc { margin-top: 6px; font-size: 13.5px; line-height: 1.6; color: #cfcfcf; white-space: pre-line;
          display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .desc.open { display: block; }
  .tab { font-family: var(--serif); font-weight: 600; font-size: 13px; color: var(--muted); padding: 0 8px;
         border: 1px solid var(--border-2); }
  .tab.on { color: var(--text); background: var(--panel-3); }
  .more { color: var(--magenta); font-size: 13px; padding: 0; margin-top: 6px; }
  .more:hover { text-decoration: underline; }
  .links { display: flex; gap: 10px; margin-left: auto; font-family: var(--sans); font-weight: 400; }
  .links a { color: var(--muted); font-size: 12px; }
  .links a:hover { color: var(--magenta); }
  .strip { grid-column: 1 / -1; display: flex; gap: 4px; overflow-x: auto; padding-bottom: 2px; }
  .strip .shot { position: relative; flex: none; }
  .strip img { width: 84px; height: 84px; object-fit: cover; cursor: pointer; display: block; outline: 2px solid transparent;
               outline-offset: -2px; }
  .strip .shot.on img { outline-color: var(--magenta); }
  .strip .src { font-size: 10.5px; color: var(--dim); margin-top: 3px; max-width: 84px; overflow: hidden;
                text-overflow: ellipsis; white-space: nowrap; }
  .strip a { position: absolute; top: 0; right: 0; background: #000; color: #fff; font-size: 11px; padding: 1px 6px;
             text-decoration: none; opacity: 0; transition: .15s; }
  .strip .shot:hover a { opacity: 1; }
  .strip a.zoom { right: auto; left: 0; }

  /* Albums */
  .albums { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
  .alb { display: flex; flex-direction: column; gap: 4px; scroll-margin-top: 20px; }
  .alb-cover { position: relative; }
  .alb-cover img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: var(--purple); }
  .alb-type { position: absolute; top: 6px; left: 6px; background: var(--orange); color: #111; font-family: var(--serif);
              font-weight: 700; font-size: 13px; padding: 1px 7px; }
  .alb-type.album { background: var(--green); color: #fff; }
  .alb-count { position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,.8); font-family: var(--serif);
               font-weight: 700; font-size: 13px; padding: 1px 7px; }
  .alb-cover a { position: absolute; right: 6px; bottom: 6px; background: #000; padding: 2px 9px; font-family: var(--serif);
                 font-weight: 600; font-size: 13px; text-decoration: none; }
  .alb-cover a:hover { background: var(--purple); }
  .alb-title { font-family: var(--serif); font-weight: 700; font-size: 16px; line-height: 1.2; margin-top: 4px; }
  .alb-sub { font-size: 12.5px; color: var(--muted); line-height: 1.55; }
  .alb .chips { margin-top: 4px; }
  .alb .chip { font-size: 11.5px; padding: 1px 7px; }

  /* Tracks: a table, like zigzag's island view */
  .tbl { width: 100%; }
  .thead, .row { display: grid; grid-template-columns: 34px minmax(0, 2.3fr) minmax(0, 1.2fr) minmax(0, 1.3fr) 92px 128px;
                 gap: 14px; align-items: center; padding: 8px 10px; }
  .thead { font-family: var(--serif); font-weight: 700; font-size: 15px; color: #bdbdbd; border-bottom: 1px solid var(--border-2); }
  .row { border-bottom: 1px solid #151515; }
  .row:hover { background: #121212; }
  .num { color: var(--dim); font-variant-numeric: tabular-nums; font-size: 13px; }
  .cell { min-width: 0; font-size: 13.5px; color: #cfcfcf; }
  .line { display: flex; align-items: center; gap: 4px; min-width: 0; }
  .title { font-size: 15px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .link { font-size: 12.5px; color: var(--muted); text-decoration: none; white-space: nowrap; overflow: hidden;
          text-overflow: ellipsis; min-width: 0; }
  .link:hover { color: var(--magenta); }
  .ic { flex: none; display: grid; place-items: center; width: 22px; height: 22px; padding: 0; color: var(--dim); }
  .ic:hover { color: var(--text); background: var(--panel-3); }
  .ic.done { color: #3ddc97; }
  .ic.sm { display: inline-grid; width: 20px; height: 20px; vertical-align: middle; }
  .ic.sm svg { width: 12px; height: 12px; }
  .grp { display: inline-flex; align-items: center; gap: 0; max-width: 100%; min-width: 0; }
  .stack { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .jump { text-align: left; padding: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .jump:hover { color: var(--magenta); }
  .jump .yr { color: var(--dim); }
  .cam { color: var(--dim); }
  .conf { display: inline-block; margin-left: 5px; font-size: 11px; font-weight: 700; line-height: 1; cursor: help; }
  .conf.hi { color: var(--green); }
  .conf.mid { color: var(--muted); }
  .conf.lo { color: var(--orange); }
  .tipbox { position: fixed; z-index: 50; width: 270px; padding: 12px 14px; background: #161616; color: var(--text);
            border: 1px solid #333; border-radius: 4px; box-shadow: 0 8px 24px rgba(0,0,0,.6); font-size: 12.5px;
            line-height: 1.45; pointer-events: none; opacity: 0; transition: opacity .12s; }
  .tipbox.on { opacity: 1; }
  .tipbox p { margin: 2px 0 8px; color: var(--muted); }
  .tipbox p:last-child { margin-bottom: 0; }
  .tip-h { font-weight: 700; font-size: 13.5px; margin-bottom: 4px; }
  .tip-h.hi { color: var(--green); } .tip-h.mid { color: var(--text); } .tip-h.lo { color: var(--orange); }
  .tip-l { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); }
  .lbl { display: none; }
  .wait { color: var(--dim); }

  .foot { text-align: center; color: var(--dim); font-size: 12px; padding: 0 0 18px; font-family: var(--serif); }
  .spinner { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%;
             animation: spin .7s linear infinite; display: inline-block; vertical-align: -2px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(16px); background: var(--panel-3);
           border: 1px solid var(--border-2); border-left: 3px solid #3ddc97; font-family: var(--serif); font-weight: 700;
           font-size: 15px; padding: 8px 16px; opacity: 0; transition: .2s; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateX(-50%); }

  @media (max-width: 820px) {
    .hero { flex-wrap: wrap; } form { flex-basis: 100%; }
    .thead { display: none; }
    .row { grid-template-columns: 26px minmax(0, 1fr); row-gap: 4px; }
    .row > .cell:not(.c-track) { grid-column: 2; }
    .lbl { display: inline; color: var(--dim); font-family: var(--serif); margin-right: 6px; }
  }
  @media (max-width: 560px) {
    body.landing h1 { font-size: 40px; }
    form, body.landing form { flex-direction: column; } .primary { padding: 10px; border-left: 0; border-top: 1px solid var(--border-2); }
    .pl { grid-template-columns: 1fr; } .pl-main { width: 100%; } .pl-title { font-size: 28px; }
    .acard { grid-template-columns: 90px 1fr; gap: 12px; } .a-main { width: 90px; height: 90px; } .a-name { font-size: 26px; }
    .albums { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body class="landing">
<div class="wrap">
  <div class="hero">
  <header>
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="white"><path d="M3 6h12v2H3zm0 4h12v2H3zm0 4h8v2H3zm14-4v8.2a3 3 0 1 0 2 2.8V12h3v-2z"/></svg>
    </div>
    <div>
      <h1>Playlist Extractor</h1>
      <p class="sub">Paste a YouTube playlist link to get titles, links, artists, albums, covers, labels, genres, BPM and key.</p>
    </div>
  </header>

  <form id="form">
    <input id="url" type="url" required autocomplete="off" autofocus
           placeholder="https://www.youtube.com/playlist?list=...">
    <button class="primary" id="go" type="submit">Extract</button>
  </form>
  <div class="error" id="error"></div>
  </div>

  <section class="results" id="results">
    <div class="pl panel">
      <div class="pl-imgs" id="plImgs"></div>
      <div>
        <p class="pl-title" id="plTitle"></p>
        <div class="count" id="count"></div>
        <div class="actions">
          <button class="ghost" id="copyTitles">Copy all titles</button>
          <button class="ghost" id="copyLinks">Copy all links</button>
          <button class="ghost" id="csv">Export all (.csv)</button>
        </div>
        <div class="progress"><div id="bar"></div></div>
        <div class="progress-label" id="barLabel"></div>
      </div>
    </div>

    <details class="sec" open>
      <summary>Artists <span class="badge" id="nArtists">0</span></summary>
      <div class="sec-body"><div class="artists-list" id="artists"><div class="empty">Searching…</div></div></div>
    </details>

    <details class="sec" open>
      <summary>Albums <span class="badge" id="nAlbums">0</span></summary>
      <div class="sec-body"><div class="albums" id="albums"><div class="empty">Searching…</div></div></div>
    </details>

    <details class="sec" open>
      <summary>Tracks <span class="badge" id="nTracks">0</span></summary>
      <div class="sec-body" style="padding:0">
        <div class="tbl">
          <div class="thead"><span>#</span><span>Track</span><span>Artist</span><span>Album</span><span>BPM</span><span>Key</span></div>
          <div id="list"></div>
        </div>
      </div>
    </details>
  </section>
</div>
<div class="toast" id="toast">Copied!</div>
<footer class="foot" id="foot"></footer>

<script>
const $ = id => document.getElementById(id);
let data = null, runId = 0;
let artists = new Map(), albums = new Map();   // info grouped by artist name / by album
const regionNames = (() => { try { return new Intl.DisplayNames(["en"], { type: "region" }); } catch { return null; } })();
const ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
const CHECK = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';

async function copy(text) {
  try { await navigator.clipboard.writeText(text); }
  catch {
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); ta.remove();
  }
  toast("Copied!");
}
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 1400);
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}
// Small copy icon placed right after a piece of text; copies `text` when clicked.
const copyBtn = (text, label) => `<button class="ic sm" data-copy-text="${esc(text)}" title="Copy ${esc(label)}">${ICON}</button>`;
const fileSafe = s => (s || "image").replace(/[\\/:*?"<>|]/g, "_");
const dl = (url, name) => `/api/image?url=${encodeURIComponent(url)}&name=${encodeURIComponent(fileSafe(name))}`;
const slug = s => "k" + [...(s || "")].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7).toString(36);
const plural = (n, w) => `${n} ${w}${n > 1 ? "s" : ""}`;

function flag(cc) {
  if (!cc || cc.length !== 2) return "";
  return String.fromCodePoint(...[...cc.toUpperCase()].map(c => 0x1F1E6 + c.charCodeAt(0) - 65));
}
function countryName(a, withFlag = true) {
  if (a.country) return `${withFlag ? flag(a.country) + " " : ""}${regionNames?.of(a.country) || a.country}`;
  return a.country_label || "";
}
function fmtDate(d) {
  if (!d || d.startsWith("0000")) return "";
  const [y, m, j] = d.split("-");
  return m && j ? new Date(+y, m - 1, +j).toLocaleDateString("en-US", { day: "numeric", month: "long", year: "numeric" }) : y;
}

/* ---------- Playlist header ---------- */
function renderPlaylist() {
  $("plTitle").textContent = data.title;
  $("count").innerHTML = [plural(data.count, "video"), data.owner && `by <span class="owner">${esc(data.owner)}</span>`].filter(Boolean).join(" · ");
  const th = data.thumbnails || [];
  $("plImgs").innerHTML = th.length ? `
    <img class="pl-main" id="plMain" src="${esc(th[0])}" alt="">
    <div class="pl-thumbs">
      ${th.length > 1 ? th.map((u, k) => `<img src="${esc(u)}" data-u="${esc(u)}" class="${k ? "" : "on"}" alt="">`).join("") : ""}
      <a class="ghost sm" id="plDl" href="${dl(th[0], data.title)}">⬇</a>
    </div>` : "";
}
$("plImgs").addEventListener("click", e => {
  const im = e.target.closest(".pl-thumbs img"); if (!im) return;
  $("plMain").src = im.dataset.u; $("plDl").href = dl(im.dataset.u, data.title);
  $("plImgs").querySelectorAll(".pl-thumbs img").forEach(x => x.classList.toggle("on", x === im));
});

/* ---------- Tracks ---------- */
function renderTracks() {
  $("nTracks").textContent = data.count;
  $("list").innerHTML = data.videos.map((v, i) => `
    <div class="row" id="row${i}">
      <div class="num">${i + 1}</div>
      <div class="cell c-track">
        <div class="line"><div class="title" title="${esc(v.title)}">${esc(v.title)}</div>
          <button class="ic" data-copy="title" data-i="${i}" title="Copy title">${ICON}</button></div>
        <div class="line"><a class="link" href="${esc(v.url)}" target="_blank" rel="noopener">${esc(v.url)}</a>
          <button class="ic" data-copy="url" data-i="${i}" title="Copy link">${ICON}</button></div>
      </div>
      <div class="cell c-artist"><span class="wait">…</span></div>
      <div class="cell c-album"></div>
      <div class="cell c-bpm"></div>
      <div class="cell c-key"></div>
    </div>`).join("");
}
const CONF_TEXT = {
  high: ["✓", "hi", "Confirmed", "Independent sources agree on this value, so it is very likely right."],
  medium: ["?", "mid", "Probably right", "The audio analysis is fairly sure, but no other source fully confirms it (sometimes only by half or double tempo). Worth a quick check by ear."],
  low: ["?", "lo", "Uncertain", "The sources disagree or the analysis is unsure. Check it by ear before relying on it."],
};
function confMark(what, level, sources, alts) {
  const c = CONF_TEXT[level];
  if (!c) return "";
  let tip = `<div class="tip-h ${c[1]}">${c[0]} ${esc(c[2])}</div><p>${esc(c[3])}</p>`;
  if (sources?.length) tip += `<div class="tip-l">Sources</div><p>${sources.map(esc).join(" + ")}</p>`;
  if (alts?.length) tip += `<div class="tip-l">Other possible ${esc(what)}</div><p>${alts.map(esc).join(", ")}</p>`;
  return `<span class="conf ${c[1]}" tabindex="0" data-tip="${esc(tip)}">${c[0]}</span>`;
}
function renderAudio(e, cell) {
  cell("bpm").innerHTML = e.bpm ? `<span class="grp"><span class="lbl">BPM</span>${e.bpm}${confMark("BPM", e.bpm_confidence, e.bpm_sources, e.bpm_alternatives)}${copyBtn(e.bpm, "BPM")}</span>` : `<span class="wait">–</span>`;
  cell("key").innerHTML = e.key ? `<span class="grp"><span class="lbl">Key</span>${esc(e.key)}${e.camelot ? `&nbsp;<span class="cam" title="Camelot notation">${esc(e.camelot)}</span>` : ""}${confMark("keys", e.key_confidence, e.key_sources, e.key_alternatives)}${copyBtn(e.key, "key")}</span>` : `<span class="wait">–</span>`;
}
/* Explanation box shown when hovering (or tapping) a ✓ / ? mark. */
const tipBox = document.createElement("div");
tipBox.className = "tipbox"; document.body.appendChild(tipBox);
function showTip(el) {
  tipBox.innerHTML = el.dataset.tip; tipBox.classList.add("on");
  const r = el.getBoundingClientRect(), w = tipBox.offsetWidth, h = tipBox.offsetHeight;
  const left = Math.max(8, Math.min(innerWidth - w - 8, r.left + r.width / 2 - w / 2));
  const top = r.top - h - 8 >= 8 ? r.top - h - 8 : r.bottom + 8;
  tipBox.style.left = left + "px"; tipBox.style.top = top + "px";
}
const hideTip = () => tipBox.classList.remove("on");
document.addEventListener("mouseover", ev => { const el = ev.target.closest?.(".conf"); el ? showTip(el) : hideTip(); });
document.addEventListener("focusin", ev => { const el = ev.target.closest?.(".conf"); if (el) showTip(el); });
document.addEventListener("click", ev => { const el = ev.target.closest?.(".conf"); el ? showTip(el) : hideTip(); });
addEventListener("scroll", hideTip, { passive: true });
function renderTrackInfo(i) {
  const e = data.videos[i].meta, row = $("row" + i), cell = c => row.querySelector(".c-" + c);
  if (!e?.found) {
    cell("artist").innerHTML = `<span class="wait">No info found</span>`;
    if (e) renderAudio(e, cell);
    return;
  }
  const year = (e.release_date || "").slice(0, 4);
  cell("artist").innerHTML = `<div class="stack"><span class="lbl">Artist</span>` + e.artists.map(a =>
    `<span class="grp"><button class="jump" data-jump="${slug("a" + a.name)}">${esc(a.name)}</button>${copyBtn(a.name, "artist")}</span>`).join("") + `</div>`;
  cell("album").innerHTML = e.album ? `<span class="grp"><span class="lbl">Album</span><button class="jump" data-jump="${albumKey(e)}">${esc(e.album)}${year && year !== "0000" ? ` <span class="yr">${year}</span>` : ""}</button>${copyBtn(e.album, "album")}</span>` : "";
  renderAudio(e, cell);
}

/* ---------- Artists (one card per artist) ---------- */
function addArtist(a, trackIdx) {
  const key = slug("a" + a.name);
  let entry = artists.get(key);
  if (!entry) {
    entry = { ...a, key, tracks: new Set(), img: 0, desc: 0, open: false };
    artists.set(key, entry);
    if (artists.size === 1) $("artists").innerHTML = "";
    const el = document.createElement("div");
    el.className = "acard"; el.id = key;
    $("artists").appendChild(el);
    $("nArtists").textContent = artists.size;
  }
  entry.tracks.add(trackIdx);
  drawArtist(entry);
}
function drawArtist(a) {
  const el = $(a.key), imgs = a.images || [], main = imgs[a.img];
  const d = (a.descriptions || [])[a.desc];
  const genres = a.all_genres?.length ? a.all_genres : a.genres || [];
  const links = Object.entries(a.links || {}).filter(([, u]) => u);
  el.innerHTML = `
    ${main ? `<img class="a-main" src="${esc(main.url)}" alt="${esc(a.name)}">` : `<div class="a-main"></div>`}
    <div style="min-width:0">
      <p class="a-name">${esc(a.name)} ${copyBtn(a.name, "artist")}</p>
      <div class="a-meta">${plural(a.tracks.size, "track")} in the playlist</div>
      <div class="chips">
        ${countryName(a) ? `<span class="chip">${esc(countryName(a))}</span>` : ""}
        ${genres.map(g => `<span class="chip">${esc(g)}</span>`).join("")}
      </div>
      <div class="desc-box">
        <div class="desc-h">Description
          ${(a.descriptions || []).length > 1 ? a.descriptions.map((x, k) =>
            `<button class="tab ${k === a.desc ? "on" : ""}" data-desc="${a.key}" data-k="${k}">${esc(x.source)}</button>`).join("") : d ? `<span class="tab on">${esc(d.source)}</span>` : ""}
          <span class="links">${links.map(([n, u]) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(n)} ↗</a>`).join("")}</span>
        </div>
        ${d ? `<div class="desc ${a.open ? "open" : ""}">${esc(d.text)}</div>
               <button class="more" data-more="${a.key}">${a.open ? "Show less" : "Read more"}</button>` : `<div class="desc muted">No description found…</div>`}
      </div>
    </div>
    ${imgs.length ? `<div class="strip">${imgs.map((im, k) => `
      <div class="shot ${k === a.img ? "on" : ""}" title="${esc(im.source)}">
        <img src="${esc(im.url)}" data-pick="${a.key}" data-k="${k}" loading="lazy" alt="" onerror="this.closest('.shot').remove()">
        <a class="zoom" href="${esc(im.url)}" target="_blank" rel="noopener" title="View full size">⤢</a>
        <a href="${dl(im.url, `${a.name} ${k + 1}`)}" title="Download">⬇</a>
        <div class="src">${esc(im.source)}</div>
      </div>`).join("")}</div>` : ""}`;
}
$("artists").addEventListener("click", e => {
  const t = e.target, a = artists.get(t.dataset.more || t.dataset.desc || t.dataset.pick);
  if (!a) return;
  if (t.dataset.more) a.open = !a.open;
  if (t.dataset.desc) { a.desc = +t.dataset.k; a.open = false; }
  if (t.dataset.pick) a.img = +t.dataset.k;
  drawArtist(a);
});

/* ---------- Albums (one card per album) ---------- */
const albumKey = e => slug("b" + (e.album_id || `${e.album_artist}|${e.album}`));
function addAlbum(e, trackIdx) {
  if (!e.album) return;
  const key = albumKey(e);
  let entry = albums.get(key);
  if (!entry) {
    entry = { key, tracks: new Set(), title: e.album, artist: e.album_artist, cover: e.cover, date: e.release_date,
              label: e.label, type: e.record_type, genres: e.album_genres || [] };
    albums.set(key, entry);
    if (albums.size === 1) $("albums").innerHTML = "";
    const el = document.createElement("div");
    el.className = "alb"; el.id = key; $("albums").appendChild(el);
    $("nAlbums").textContent = albums.size;
  }
  entry.tracks.add(trackIdx);
  const types = { album: "Album", single: "Single", ep: "EP", compile: "Compilation" };
  $(key).innerHTML = `
    <div class="alb-cover">
      ${entry.cover ? `<img src="${esc(entry.cover)}" alt="" loading="lazy">` : `<img alt="">`}
      ${entry.type ? `<span class="alb-type ${esc(entry.type)}">${esc(types[entry.type] || entry.type)}</span>` : ""}
      <span class="alb-count" title="Tracks in the playlist">${entry.tracks.size}</span>
      ${entry.cover ? `<a href="${dl(entry.cover, `${entry.artist} - ${entry.title}`)}" title="Download the cover">⬇ Cover</a>` : ""}
    </div>
    <div class="alb-title">${esc(entry.title)} ${copyBtn(entry.title, "album")}</div>
    <div class="alb-sub">
      ${esc(entry.artist || "")}<br>
      ${entry.date ? `${esc(fmtDate(entry.date))}<br>` : ""}
      ${entry.label ? `${esc(entry.label)}<br>` : ""}
    </div>
    ${entry.genres.length ? `<div class="chips">${entry.genres.map(g =>
      `<span class="chip" title="Source: ${esc(g.sources.join(", "))}">${esc(g.name)}</span>`).join("")}</div>` : ""}`;
}

/* ---------- Progressive loading ---------- */
async function enrichAll(id) {
  let next = 0, done = 0;
  const total = data.videos.length;
  const progress = () => {
    $("bar").style.width = `${(done / total) * 100}%`;
    $("barLabel").textContent = done < total ? `Looking up info: ${done} / ${total} tracks…` : "All info loaded.";
  };
  progress();
  async function worker() {
    while (next < total && id === runId) {
      const i = next++, v = data.videos[i];
      try {
        const r = await fetch("/api/enrich", { method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ title: v.title, channel: v.channel, url: v.url }) });
        v.meta = await r.json();
      } catch { v.meta = { found: false }; }
      if (id !== runId) return;
      if (v.meta.found) {
        v.meta.artists.forEach(a => addArtist(a, i));
        addAlbum(v.meta, i);
      }
      renderTrackInfo(i);
      done++; progress();
    }
  }
  await Promise.all([1, 2, 3, 4].map(worker));
  if (id === runId) {
    if (!artists.size) $("artists").innerHTML = `<div class="empty">No artists found.</div>`;
    if (!albums.size) $("albums").innerHTML = `<div class="empty">No albums found.</div>`;
  }
}

$("results").addEventListener("click", e => {
  const c = e.target.closest("[data-copy], [data-copy-text]");
  if (c) {
    const icon = c.innerHTML;
    copy(c.dataset.copyText ?? data.videos[c.dataset.i][c.dataset.copy]);
    c.classList.add("done"); c.innerHTML = CHECK;
    setTimeout(() => { c.classList.remove("done"); c.innerHTML = icon; }, 1500);
    return;
  }
  const j = e.target.closest("[data-jump]");
  if (j && $(j.dataset.jump)) {
    const el = $(j.dataset.jump);
    el.closest("details").open = true;
    el.scrollIntoView({ behavior: "smooth", block: "center" });
    el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1600);
  }
});

$("copyTitles").onclick = () => data && copy(data.videos.map(v => v.title).join("\n"));
$("copyLinks").onclick = () => data && copy(data.videos.map(v => v.url).join("\n"));

function save(text, name, type) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; a.click(); URL.revokeObjectURL(a.href);
}
$("csv").onclick = () => {
  if (!data) return;
  const q = x => `"${String(x ?? "").replace(/"/g, '""')}"`;
  const head = ["YouTube title", "Link", "Artists", "Country", "Track", "Album", "Release date", "Label", "Genres", "BPM", "BPM confidence", "Key", "Camelot", "Key confidence", "Cover", "Artist photos"];
  const rows = data.videos.map(v => {
    const e = v.meta || {};
    const ar = e.artists || [];
    return [v.title, v.url, ar.map(a => a.name).join(", "), ar.map(a => countryName(a, false)).join(", "), e.track, e.album,
            e.release_date, e.label, (e.genres || []).map(g => g.name).join(", "), e.bpm, e.bpm_confidence, e.key, e.camelot, e.key_confidence, e.cover,
            ar.flatMap(a => (a.images || []).map(i => i.url)).join(" ")].map(q).join(";");
  });
  save("﻿" + [head.map(q).join(";"), ...rows].join("\r\n"), fileSafe(data.title || "playlist") + ".csv", "text/csv;charset=utf-8");
};

fetch("/api/version").then(r => r.json()).then(v => {
  $("foot").innerHTML = `Playlist Extractor ${esc(v.version)} · <a href="https://github.com/BertrandGratin/playlist-extractor/releases" target="_blank" rel="noopener">GitHub</a> · BPM &amp; key data: <a href="https://getsongbpm.com" target="_blank" rel="noopener">GetSongBPM</a>`;
}).catch(() => {});

$("form").onsubmit = async e => {
  e.preventDefault();
  const btn = $("go"); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
  $("error").style.display = "none";
  const id = ++runId;
  try {
    const r = await fetch("/api/playlist", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url: $("url").value })
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || "Unknown error");
    data = j; artists = new Map(); albums = new Map();
    $("artists").innerHTML = $("albums").innerHTML = `<div class="empty">Searching…</div>`;
    $("nArtists").textContent = $("nAlbums").textContent = "0";
    renderPlaylist(); renderTracks();
    document.body.classList.remove("landing");
    $("results").style.display = "block";
    enrichAll(id);
  } catch (err) {
    $("error").textContent = err.message; $("error").style.display = "block";
    $("results").style.display = "none";
  } finally {
    btn.disabled = false; btn.textContent = "Extract";
  }
};
</script>
</body>
</html>
