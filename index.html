<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Extracteur de playlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f13; --panel: #18181f; --panel-2: #20202a; --border: #2c2c38;
    --text: #f2f2f5; --muted: #9a9aab; --accent: #ff3b5c; --accent-2: #ff7a45;
    --ok: #3ddc97;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; font-family: Inter, system-ui, sans-serif;
    background: radial-gradient(1200px 600px at 10% -10%, #2a1020 0%, transparent 60%),
                radial-gradient(900px 500px at 110% 10%, #2a1a10 0%, transparent 55%), var(--bg);
    color: var(--text);
  }
  .wrap { max-width: 920px; margin: 0 auto; padding: 48px 20px 80px; }
  header { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; }
  .logo {
    width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 8px 30px -8px var(--accent);
  }
  h1 { font-size: 26px; margin: 0; letter-spacing: -0.02em; }
  .sub { color: var(--muted); margin: 4px 0 0; font-size: 14px; }

  form { display: flex; gap: 10px; background: var(--panel); border: 1px solid var(--border);
         padding: 8px; border-radius: 16px; }
  input {
    flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: var(--text);
    font: inherit; font-size: 15px; padding: 12px 14px;
  }
  input::placeholder { color: #666676; }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 12px; transition: .15s; }
  .primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: white;
    font-weight: 600; padding: 0 22px; white-space: nowrap;
  }
  .primary:hover { filter: brightness(1.1); }
  .primary:disabled { opacity: .6; cursor: wait; }

  .error { margin-top: 16px; padding: 12px 16px; border-radius: 12px; background: #3a1520;
           border: 1px solid #6b2233; color: #ffb3c0; display: none; }

  .results { margin-top: 32px; display: none; }
  .ghost { background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
           padding: 9px 14px; font-size: 13px; font-weight: 500; text-decoration: none; display: inline-flex;
           align-items: center; gap: 6px; border-radius: 12px; }
  .ghost:hover { border-color: #4a4a5c; background: #262632; }
  .ghost.sm { padding: 6px 10px; font-size: 12px; border-radius: 10px; }
  .muted { color: var(--muted); }

  /* En-tête de la playlist */
  .pl { display: grid; grid-template-columns: auto 1fr; gap: 20px; background: var(--panel);
        border: 1px solid var(--border); border-radius: 18px; padding: 18px; }
  .pl-imgs { display: flex; flex-direction: column; gap: 8px; }
  .pl-main { width: 220px; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 12px; background: var(--panel-2);
             border: 1px solid var(--border); display: block; }
  .pl-thumbs { display: flex; gap: 6px; }
  .pl-thumbs img { width: 50px; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 6px; cursor: pointer;
                   border: 1px solid var(--border); opacity: .7; }
  .pl-thumbs img:hover, .pl-thumbs img.on { opacity: 1; border-color: var(--accent); }
  .pl-title { font-size: 20px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  .count { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .progress { height: 3px; border-radius: 3px; background: var(--panel-2); margin-top: 14px; overflow: hidden; }
  .progress div { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .3s; }
  .progress-label { font-size: 12px; color: var(--muted); margin-top: 6px; }

  /* Sections */
  details.sec { margin-top: 28px; }
  details.sec > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px;
                          font-size: 16px; font-weight: 600; margin-bottom: 12px; user-select: none; }
  details.sec > summary::-webkit-details-marker { display: none; }
  details.sec > summary::before { content: "▸"; color: var(--muted); transition: .15s; }
  details.sec[open] > summary::before { transform: rotate(90deg); }
  .badge { font-size: 12px; font-weight: 500; color: var(--muted); background: var(--panel-2);
           border: 1px solid var(--border); border-radius: 999px; padding: 1px 9px; }
  .empty { color: var(--muted); font-size: 13px; }

  /* Artistes */
  .artists-list { display: flex; flex-direction: column; gap: 12px; }
  .acard { display: grid; grid-template-columns: 140px 1fr; gap: 18px; background: var(--panel);
           border: 1px solid var(--border); border-radius: 16px; padding: 16px; scroll-margin-top: 20px; }
  .acard.flash, .alb.flash { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255,59,92,.15); }
  .a-main { width: 140px; height: 140px; border-radius: 12px; object-fit: cover; background: var(--panel-2);
            border: 1px solid var(--border); display: block; }
  .a-name { font-size: 18px; font-weight: 700; margin: 0; }
  .a-meta { font-size: 13px; color: #c9c9d6; margin-top: 4px; display: flex; gap: 10px; flex-wrap: wrap; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .chip { font-size: 11.5px; padding: 2px 8px; border-radius: 999px; color: #ffd0b8;
          background: rgba(255,122,69,.12); border: 1px solid rgba(255,122,69,.3); }
  .desc { margin-top: 10px; font-size: 13.5px; line-height: 1.55; color: #d6d6e0; white-space: pre-line;
          display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .desc.open { display: block; }
  .desc-bar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 6px; font-size: 12px; }
  .tab { background: transparent; color: var(--muted); border: 1px solid var(--border); border-radius: 999px;
         padding: 2px 9px; font-size: 11.5px; }
  .tab.on { color: var(--text); border-color: var(--accent); }
  .more { background: none; color: var(--accent-2); padding: 0; font-size: 12px; }
  .links { display: flex; gap: 10px; margin-left: auto; }
  .links a { color: var(--muted); font-size: 12px; }
  .links a:hover { color: var(--accent-2); }
  .strip { grid-column: 1 / -1; display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
  .strip .shot { position: relative; flex: none; }
  .strip img { width: 76px; height: 76px; object-fit: cover; border-radius: 10px; cursor: pointer; display: block;
               border: 2px solid transparent; }
  .strip .shot.on img { border-color: var(--accent); }
  .strip .src { font-size: 10px; color: var(--muted); text-align: center; margin-top: 2px; max-width: 76px;
                overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .strip a { position: absolute; top: 4px; right: 4px; background: rgba(0,0,0,.72); color: white; border-radius: 6px;
             font-size: 10.5px; padding: 1px 5px; text-decoration: none; opacity: 0; transition: .15s; }
  .strip .shot:hover a { opacity: 1; }
  .strip a.zoom { right: auto; left: 4px; }

  /* Albums */
  .albums { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
  .alb { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 12px;
         display: flex; flex-direction: column; gap: 6px; scroll-margin-top: 20px; }
  .alb-cover { position: relative; }
  .alb-cover img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px; display: block;
                   background: var(--panel-2); }
  .alb-cover a { position: absolute; right: 8px; bottom: 8px; background: rgba(0,0,0,.72); color: white;
                 border-radius: 8px; padding: 4px 9px; font-size: 12px; text-decoration: none; }
  .alb-cover a:hover { background: var(--accent); }
  .alb-title { font-weight: 600; font-size: 14px; line-height: 1.3; }
  .alb-sub { font-size: 12.5px; color: var(--muted); line-height: 1.5; }

  /* Morceaux */
  .list { display: flex; flex-direction: column; gap: 6px; }
  .row { display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: start;
         background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; }
  .row:hover { border-color: #3d3d4d; }
  .num { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; text-align: right; padding-top: 3px; }
  .meta { min-width: 0; }
  .line { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .line + .line { margin-top: 2px; }
  .title { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .link { font-size: 12.5px; color: var(--muted); text-decoration: none; white-space: nowrap; overflow: hidden;
          text-overflow: ellipsis; min-width: 0; }
  .link:hover { color: var(--accent-2); }
  .ic { flex: none; display: grid; place-items: center; width: 24px; height: 24px; padding: 0;
        background: transparent; color: var(--muted); border-radius: 7px; }
  .ic:hover { background: var(--panel-2); color: var(--text); }
  .ic.done { color: var(--ok); }
  .info { margin-top: 6px; font-size: 12.5px; color: #c9c9d6; display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
  .jump { background: var(--panel-2); border: 1px solid var(--border); color: var(--text); border-radius: 999px;
          padding: 1px 9px; font-size: 12px; }
  .jump:hover { border-color: var(--accent); }
  .jump.alb-j { border-radius: 8px; color: #c9c9d6; }

  .foot { text-align: center; color: #55556a; font-size: 12px; padding: 0 0 24px; }
  .foot a { color: inherit; }
  .spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.4); border-top-color: white;
             border-radius: 50%; animation: spin .7s linear infinite; display: inline-block; vertical-align: -3px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px);
           background: var(--ok); color: #06261a; font-weight: 600; padding: 10px 18px; border-radius: 999px;
           opacity: 0; transition: .25s; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateX(-50%); }

  @media (max-width: 560px) {
    form { flex-direction: column; } .primary { padding: 12px; }
    .pl { grid-template-columns: 1fr; } .pl-main { width: 100%; }
    .acard { grid-template-columns: 84px 1fr; gap: 12px; } .a-main { width: 84px; height: 84px; }
    .albums { grid-template-columns: repeat(2, 1fr); }
    .row { grid-template-columns: 1fr; } .num { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="white"><path d="M3 6h12v2H3zm0 4h12v2H3zm0 4h8v2H3zm14-4v8.2a3 3 0 1 0 2 2.8V12h3v-2z"/></svg>
    </div>
    <div>
      <h1>Extracteur de playlist</h1>
      <p class="sub">Colle un lien de playlist YouTube : titres, liens, artistes, albums, covers, labels et genres.</p>
    </div>
  </header>

  <form id="form">
    <input id="url" type="url" required autocomplete="off"
           placeholder="https://www.youtube.com/playlist?list=...">
    <button class="primary" id="go" type="submit">Extraire</button>
  </form>
  <div class="error" id="error"></div>

  <section class="results" id="results">
    <div class="pl">
      <div class="pl-imgs" id="plImgs"></div>
      <div>
        <p class="pl-title" id="plTitle"></p>
        <div class="count" id="count"></div>
        <div class="actions">
          <button class="ghost" id="copyTitles">Copier tous les titres</button>
          <button class="ghost" id="copyLinks">Copier tous les liens</button>
          <button class="ghost" id="csv">Exporter tout (.csv)</button>
        </div>
        <div class="progress"><div id="bar"></div></div>
        <div class="progress-label" id="barLabel"></div>
      </div>
    </div>

    <details class="sec" open>
      <summary>Artistes <span class="badge" id="nArtists">0</span></summary>
      <div class="artists-list" id="artists"><div class="empty">Recherche en cours…</div></div>
    </details>

    <details class="sec" open>
      <summary>Albums <span class="badge" id="nAlbums">0</span></summary>
      <div class="albums" id="albums"><div class="empty">Recherche en cours…</div></div>
    </details>

    <details class="sec" open>
      <summary>Morceaux <span class="badge" id="nTracks">0</span></summary>
      <div class="list" id="list"></div>
    </details>
  </section>
</div>
<div class="toast" id="toast">Copié !</div>
<footer class="foot" id="foot"></footer>

<script>
const $ = id => document.getElementById(id);
let data = null, runId = 0;
let artists = new Map(), albums = new Map();   // infos regroupées, par nom d'artiste / par album
const regionFr = (() => { try { return new Intl.DisplayNames(["fr"], { type: "region" }); } catch { return null; } })();
const ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
const CHECK = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';

async function copy(text) {
  try { await navigator.clipboard.writeText(text); }
  catch {
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); ta.remove();
  }
  toast("Copié !");
}
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 1400);
}

function esc(s) { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; }
const fileSafe = s => (s || "image").replace(/[\\/:*?"<>|]/g, "_");
const dl = (url, name) => `/api/image?url=${encodeURIComponent(url)}&name=${encodeURIComponent(fileSafe(name))}`;
const slug = s => "k" + [...(s || "")].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7).toString(36);
const plural = (n, w) => `${n} ${w}${n > 1 ? (w.endsWith("eau") ? "x" : "s") : ""}`;

function flag(cc) {
  if (!cc || cc.length !== 2) return "";
  return String.fromCodePoint(...[...cc.toUpperCase()].map(c => 0x1F1E6 + c.charCodeAt(0) - 65));
}
function countryName(a, withFlag = true) {
  if (a.country) return `${withFlag ? flag(a.country) + " " : ""}${regionFr?.of(a.country) || a.country}`;
  return a.country_label || "";
}
function frDate(d) {
  if (!d || d.startsWith("0000")) return "";
  const [y, m, j] = d.split("-");
  return m && j ? new Date(+y, m - 1, +j).toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" }) : y;
}

/* ---------- En-tête playlist ---------- */
function renderPlaylist() {
  $("plTitle").textContent = data.title;
  $("count").textContent = [plural(data.count, "vidéo"), data.owner && `par ${data.owner}`].filter(Boolean).join(" · ");
  const th = data.thumbnails || [];
  $("plImgs").innerHTML = th.length ? `
    <img class="pl-main" id="plMain" src="${esc(th[0])}" alt="">
    <div class="pl-thumbs">
      ${th.length > 1 ? th.map((u, k) => `<img src="${esc(u)}" data-u="${esc(u)}" class="${k ? "" : "on"}" alt="">`).join("") : ""}
      <a class="ghost sm" id="plDl" href="${dl(th[0], data.title)}">⬇</a>
    </div>` : "";
}
$("plImgs").addEventListener("click", e => {
  const im = e.target.closest(".pl-thumbs img"); if (!im) return;
  $("plMain").src = im.dataset.u; $("plDl").href = dl(im.dataset.u, data.title);
  $("plImgs").querySelectorAll(".pl-thumbs img").forEach(x => x.classList.toggle("on", x === im));
});

/* ---------- Morceaux ---------- */
function renderTracks() {
  $("nTracks").textContent = data.count;
  $("list").innerHTML = data.videos.map((v, i) => `
    <div class="row" id="row${i}">
      <div class="num">${i + 1}</div>
      <div class="meta">
        <div class="line"><div class="title" title="${esc(v.title)}">${esc(v.title)}</div>
          <button class="ic" data-copy="title" data-i="${i}" title="Copier le titre">${ICON}</button></div>
        <div class="line"><a class="link" href="${esc(v.url)}" target="_blank" rel="noopener">${esc(v.url)}</a>
          <button class="ic" data-copy="url" data-i="${i}" title="Copier le lien">${ICON}</button></div>
        <div class="info"><span class="muted">Recherche des infos…</span></div>
      </div>
    </div>`).join("");
}
function renderTrackInfo(i) {
  const e = data.videos[i].meta, info = $("row" + i).querySelector(".info");
  if (!e?.found) { info.innerHTML = `<span class="muted">Infos introuvables pour ce morceau.</span>`; return; }
  const year = (e.release_date || "").slice(0, 4);
  info.innerHTML = e.artists.map(a => `<button class="jump" data-jump="${slug("a" + a.name)}">${esc(a.name)}</button>`).join("")
    + (e.album ? `<button class="jump alb-j" data-jump="${albumKey(e)}">💿 ${esc(e.album)}${year && year !== "0000" ? ` · ${year}` : ""}</button>` : "");
}

/* ---------- Artistes (une fiche par artiste) ---------- */
function addArtist(a, trackIdx) {
  const key = slug("a" + a.name);
  let entry = artists.get(key);
  if (!entry) {
    entry = { ...a, key, tracks: new Set(), img: 0, desc: 0, open: false };
    artists.set(key, entry);
    if (artists.size === 1) $("artists").innerHTML = "";
    const el = document.createElement("div");
    el.className = "acard"; el.id = key;
    $("artists").appendChild(el);
    $("nArtists").textContent = artists.size;
  }
  entry.tracks.add(trackIdx);
  drawArtist(entry);
}
function drawArtist(a) {
  const el = $(a.key), imgs = a.images || [], main = imgs[a.img];
  const d = (a.descriptions || [])[a.desc];
  const genres = a.all_genres?.length ? a.all_genres : a.genres || [];
  const links = Object.entries(a.links || {}).filter(([, u]) => u);
  el.innerHTML = `
    ${main ? `<img class="a-main" src="${esc(main.url)}" alt="${esc(a.name)}">` : `<div class="a-main"></div>`}
    <div style="min-width:0">
      <p class="a-name">${esc(a.name)}</p>
      <div class="a-meta">
        ${countryName(a) ? `<span>${esc(countryName(a))}</span>` : ""}
        <span class="muted">${plural(a.tracks.size, "morceau")} dans la playlist</span>
      </div>
      ${genres.length ? `<div class="chips">${genres.map(g => `<span class="chip">${esc(g)}</span>`).join("")}</div>` : ""}
      ${d ? `<div class="desc ${a.open ? "open" : ""}">${esc(d.text)}</div>` : ""}
      <div class="desc-bar">
        ${d ? `<button class="more" data-more="${a.key}">${a.open ? "Réduire" : "Lire la suite"}</button>` : `<span class="muted">Pas de description trouvée.</span>`}
        ${(a.descriptions || []).length > 1 ? a.descriptions.map((x, k) =>
          `<button class="tab ${k === a.desc ? "on" : ""}" data-desc="${a.key}" data-k="${k}">${esc(x.source)}</button>`).join("") : d ? `<span class="muted">· ${esc(d.source)}</span>` : ""}
        <span class="links">${links.map(([n, u]) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(n)} ↗</a>`).join("")}</span>
      </div>
    </div>
    ${imgs.length ? `<div class="strip">${imgs.map((im, k) => `
      <div class="shot ${k === a.img ? "on" : ""}" title="${esc(im.source)}">
        <img src="${esc(im.url)}" data-pick="${a.key}" data-k="${k}" loading="lazy" alt="" onerror="this.closest('.shot').remove()">
        <a class="zoom" href="${esc(im.url)}" target="_blank" rel="noopener" title="Voir en grand">⤢</a>
        <a href="${dl(im.url, `${a.name} ${k + 1}`)}" title="Télécharger">⬇</a>
        <div class="src">${esc(im.source)}</div>
      </div>`).join("")}</div>` : ""}`;
}
$("artists").addEventListener("click", e => {
  const t = e.target, a = artists.get(t.dataset.more || t.dataset.desc || t.dataset.pick);
  if (!a) return;
  if (t.dataset.more) a.open = !a.open;
  if (t.dataset.desc) { a.desc = +t.dataset.k; a.open = false; }
  if (t.dataset.pick) a.img = +t.dataset.k;
  drawArtist(a);
});

/* ---------- Albums (une fiche par album) ---------- */
const albumKey = e => slug("b" + (e.album_id || `${e.album_artist}|${e.album}`));
function addAlbum(e, trackIdx) {
  if (!e.album) return;
  const key = albumKey(e);
  let entry = albums.get(key);
  if (!entry) {
    entry = { key, tracks: new Set(), title: e.album, artist: e.album_artist, cover: e.cover, date: e.release_date,
              label: e.label, type: e.record_type, genres: e.album_genres || [] };
    albums.set(key, entry);
    if (albums.size === 1) $("albums").innerHTML = "";
    const el = document.createElement("div");
    el.className = "alb"; el.id = key; $("albums").appendChild(el);
    $("nAlbums").textContent = albums.size;
  }
  entry.tracks.add(trackIdx);
  const types = { album: "Album", single: "Single", ep: "EP", compile: "Compilation" };
  $(key).innerHTML = `
    <div class="alb-cover">
      ${entry.cover ? `<img src="${esc(entry.cover)}" alt="" loading="lazy"><a href="${dl(entry.cover, `${entry.artist} - ${entry.title}`)}" title="Télécharger la cover">⬇ Cover</a>` : `<img alt="">`}
    </div>
    <div class="alb-title">${esc(entry.title)}</div>
    <div class="alb-sub">
      ${esc(entry.artist || "")}${entry.type ? ` · ${esc(types[entry.type] || entry.type)}` : ""}<br>
      ${entry.date ? `📅 ${esc(frDate(entry.date))}<br>` : ""}
      ${entry.label ? `🏷️ ${esc(entry.label)}<br>` : ""}
      <span>${plural(entry.tracks.size, "morceau")} dans la playlist</span>
    </div>
    ${entry.genres.length ? `<div class="chips" style="margin-top:2px">${entry.genres.map(g =>
      `<span class="chip" title="Source : ${esc(g.sources.join(", "))}">${esc(g.name)}</span>`).join("")}</div>` : ""}`;
}

/* ---------- Chargement progressif ---------- */
async function enrichAll(id) {
  let next = 0, done = 0;
  const total = data.videos.length;
  const progress = () => {
    $("bar").style.width = `${(done / total) * 100}%`;
    $("barLabel").textContent = done < total ? `Recherche des infos : ${done} / ${total} morceaux…` : "Toutes les infos sont chargées.";
  };
  progress();
  async function worker() {
    while (next < total && id === runId) {
      const i = next++, v = data.videos[i];
      try {
        const r = await fetch("/api/enrich", { method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ title: v.title, channel: v.channel }) });
        v.meta = await r.json();
      } catch { v.meta = { found: false }; }
      if (id !== runId) return;
      if (v.meta.found) {
        v.meta.artists.forEach(a => addArtist(a, i));
        addAlbum(v.meta, i);
      }
      renderTrackInfo(i);
      done++; progress();
    }
  }
  await Promise.all([1, 2, 3, 4].map(worker));
  if (id === runId) {
    if (!artists.size) $("artists").innerHTML = `<div class="empty">Aucun artiste trouvé.</div>`;
    if (!albums.size) $("albums").innerHTML = `<div class="empty">Aucun album trouvé.</div>`;
  }
}

$("results").addEventListener("click", e => {
  const c = e.target.closest("[data-copy]");
  if (c) {
    const icon = c.innerHTML;
    copy(data.videos[c.dataset.i][c.dataset.copy]);
    c.classList.add("done"); c.innerHTML = CHECK;
    setTimeout(() => { c.classList.remove("done"); c.innerHTML = icon; }, 1500);
    return;
  }
  const j = e.target.closest("[data-jump]");
  if (j && $(j.dataset.jump)) {
    const el = $(j.dataset.jump);
    el.closest("details").open = true;
    el.scrollIntoView({ behavior: "smooth", block: "center" });
    el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1600);
  }
});

$("copyTitles").onclick = () => data && copy(data.videos.map(v => v.title).join("\n"));
$("copyLinks").onclick = () => data && copy(data.videos.map(v => v.url).join("\n"));

function save(text, name, type) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; a.click(); URL.revokeObjectURL(a.href);
}
$("csv").onclick = () => {
  if (!data) return;
  const q = x => `"${String(x ?? "").replace(/"/g, '""')}"`;
  const head = ["Titre YouTube", "Lien", "Artistes", "Pays", "Morceau", "Album", "Date de sortie", "Label", "Genres", "Cover", "Photos artiste"];
  const rows = data.videos.map(v => {
    const e = v.meta?.found ? v.meta : {};
    const ar = e.artists || [];
    return [v.title, v.url, ar.map(a => a.name).join(", "), ar.map(a => countryName(a, false)).join(", "), e.track, e.album,
            e.release_date, e.label, (e.genres || []).map(g => g.name).join(", "), e.cover,
            ar.flatMap(a => (a.images || []).map(i => i.url)).join(" ")].map(q).join(";");
  });
  save("﻿" + [head.map(q).join(";"), ...rows].join("\r\n"), fileSafe(data.title || "playlist") + ".csv", "text/csv;charset=utf-8");
};

fetch("/api/version").then(r => r.json()).then(v => {
  $("foot").innerHTML = `Extracteur de playlist ${esc(v.version)} · <a href="https://github.com/BertrandGratin/playlist-extractor/releases" target="_blank" rel="noopener">GitHub</a>`;
}).catch(() => {});

$("form").onsubmit = async e => {
  e.preventDefault();
  const btn = $("go"); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
  $("error").style.display = "none";
  const id = ++runId;
  try {
    const r = await fetch("/api/playlist", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url: $("url").value })
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || "Erreur inconnue");
    data = j; artists = new Map(); albums = new Map();
    $("artists").innerHTML = $("albums").innerHTML = `<div class="empty">Recherche en cours…</div>`;
    $("nArtists").textContent = $("nAlbums").textContent = "0";
    renderPlaylist(); renderTracks();
    $("results").style.display = "block";
    enrichAll(id);
  } catch (err) {
    $("error").textContent = err.message; $("error").style.display = "block";
    $("results").style.display = "none";
  } finally {
    btn.disabled = false; btn.textContent = "Extraire";
  }
};
</script>
</body>
